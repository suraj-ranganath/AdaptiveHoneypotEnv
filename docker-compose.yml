# Gate A topology. The trusted launcher in adaptivehoneypotenv/deployment.py
# starts each episode: fresh APP_SECRET, controller token, host firewall, and
# a 127.0.0.1 relay. Docker does not publish ports on an internal network, so
# this file has no ports key. The manual profile keeps `docker compose up`
# from starting a container that has no episode secret.
name: adaptivehoneypotenv

networks:
  internal:
    internal: true

services:
  target:
    profiles: ["manual"]
    image: adaptivehoneypotenv-target:gate-a
    build:
      context: .
      dockerfile: docker/target/Dockerfile
    init: true
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    user: "65532:65532"
    working_dir: /run/state
    tmpfs:
      - /run/state:rw,nosuid,nodev,noexec,size=64m,uid=65532,gid=65532
      - /tmp:rw,nosuid,nodev,noexec,size=16m,uid=65532,gid=65532
    pids_limit: 64
    mem_limit: 256m
    cpus: 0.50
    dns:
      - 127.0.0.1
    dns_opt:
      - attempts:1
      - timeout:1
    environment:
      APP_SECRET: ${APP_SECRET:-}
      HOME: /tmp
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: /opt/secretstorage
    networks: [internal]

  bridge:
    profiles: ["manual"]
    image: adaptivehoneypotenv-bridge:gate-a
    build:
      context: .
      dockerfile: docker/bridge/Dockerfile
    init: true
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    user: "65532:65532"
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=16m,uid=65532,gid=65532
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.50
    dns:
      - 127.0.0.1
    dns_opt:
      - attempts:1
      - timeout:1
    environment:
      UPSTREAM_HOST: ${UPSTREAM_HOST:-127.0.0.1}
      UPSTREAM_PORT: "5000"
      CONTROLLER_TOKEN: ${CONTROLLER_TOKEN:-}
      PROFILE: ${PROFILE:-malicious}
      HOME: /tmp
      PYTHONDONTWRITEBYTECODE: "1"
    depends_on: [target]
    networks: [internal]
