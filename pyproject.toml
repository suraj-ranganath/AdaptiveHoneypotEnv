[project]
name = "adaptivehoneypotenv"
version = "0.0.1"
description = "Environment for training and evaluating adaptive honeypot creation against AI agent swarms."
readme = "README.md"
requires-python = ">=3.11.4"
dependencies = [
    "docker==7.1.0",
    "pydantic>=2.10,<3",
    "pyyaml>=6,<7",
]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8",
    "ruff>=0.8",
    "types-PyYAML>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["adaptivehoneypotenv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-q"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["adaptivehoneypotenv", "tests"]
extend-exclude = ["third_party"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["adaptivehoneypotenv"]
plugins = ["pydantic.mypy"]
warn_unused_ignores = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[[tool.mypy.overrides]]
module = ["docker", "docker.*"]
follow_imports = "skip"
ignore_missing_imports = true
